<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="tile"><rect width="64" height="64" rx="12"/></clipPath>
    <clipPath id="pt"><path d="M0 0H64L0 64Z"/></clipPath>
    <clipPath id="es"><path d="M64 0V64H0Z"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <!-- Spain: red / yellow (double) / red -->
    <g clip-path="url(#es)">
      <rect width="64" height="64" fill="#aa151b"/>
      <rect y="16" width="64" height="32" fill="#f1bf00"/>
    </g>
    <!-- Portugal: green 2/5, red 3/5, armillary sphere on the divide -->
    <g clip-path="url(#pt)">
      <rect width="26" height="64" fill="#046a38"/>
      <rect x="26" width="38" height="64" fill="#da291c"/>
      <circle cx="26" cy="22" r="9" fill="#ffe000"/>
      <circle cx="26" cy="22" r="5" fill="#da291c" stroke="#fff" stroke-width="1.6"/>
    </g>
    <path d="M66 -2L-2 66" stroke="#fff" stroke-width="3"/>
  </g>
</svg>
